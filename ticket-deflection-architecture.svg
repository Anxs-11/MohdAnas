<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" font-family="'DM Mono','Courier New',monospace" font-size="11">
  <defs>
    <marker id="arr-g" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#00E5A0"/></marker>
    <marker id="arr-y" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#FFD700"/></marker>
    <marker id="arr-r" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#ff6b6b"/></marker>
    <marker id="arr-b" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#4C9AFF"/></marker>
    <marker id="arr-p" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#B388FF"/></marker>
    <marker id="arr-dim" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#555"/></marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="720" fill="#080C0F" rx="12"/>

  <!-- Title -->
  <text x="30" y="30" fill="#555" font-size="9" letter-spacing="2">— PROJECT — ARCHITECTURE DIAGRAM —</text>
  <text x="30" y="54" fill="#fff" font-size="18" font-weight="700" font-family="'Syne',sans-serif">AI Ticket Deflection System</text>

  <!-- ── INPUT: Support Portal ── -->
  <rect x="30" y="80" width="150" height="64" rx="8" fill="#0d1117" stroke="#4C9AFF" stroke-width="2"/>
  <text x="105" y="100" fill="#4C9AFF" font-size="8" text-anchor="middle" letter-spacing="2">INPUT</text>
  <text x="105" y="116" fill="#fff" font-size="12" text-anchor="middle" font-weight="700">Support Portal</text>
  <text x="105" y="133" fill="#aaa" font-size="8.5" text-anchor="middle">summary · description · component</text>

  <!-- Arrow: Portal → Normalize -->
  <line x1="180" y1="112" x2="228" y2="112" stroke="#4C9AFF" stroke-width="1.5" marker-end="url(#arr-b)"/>

  <!-- ── NORMALIZE ── -->
  <rect x="230" y="80" width="150" height="64" rx="8" fill="#0d1117" stroke="#00E5A0" stroke-width="2"/>
  <text x="305" y="100" fill="#00E5A0" font-size="8" text-anchor="middle" letter-spacing="2">STEP 1 · LLM</text>
  <text x="305" y="116" fill="#fff" font-size="12" text-anchor="middle" font-weight="700">Normalise Query</text>
  <text x="305" y="133" fill="#aaa" font-size="8.5" text-anchor="middle">specific details stripped</text>

  <!-- Arrow: Normalize → Classify -->
  <line x1="380" y1="112" x2="428" y2="112" stroke="#00E5A0" stroke-width="1.5" marker-end="url(#arr-g)"/>

  <!-- ── CLASSIFY ── -->
  <rect x="430" y="66" width="185" height="92" rx="8" fill="#0d1117" stroke="#00E5A0" stroke-width="2.5"/>
  <text x="522" y="84" fill="#00E5A0" font-size="8" text-anchor="middle" letter-spacing="2">STEP 2 · CLASSIFIER</text>
  <text x="522" y="100" fill="#fff" font-size="12" text-anchor="middle" font-weight="700">Classify Request</text>
  <text x="522" y="116" fill="#aaa" font-size="8.5" text-anchor="middle">HuggingFace embeddings + RAG</text>
  <text x="522" y="130" fill="#aaa" font-size="8.5" text-anchor="middle">per-component samples</text>
  <text x="522" y="144" fill="#555" font-size="8" text-anchor="middle">threshold: 75</text>

  <!-- Sample pool annotation -->
  <rect x="30" y="200" width="170" height="76" rx="6" fill="#0d1117" stroke="#333" stroke-width="1"/>
  <text x="115" y="218" fill="#555" font-size="8" text-anchor="middle" letter-spacing="1.5">SAMPLE POOL (per component)</text>
  <text x="115" y="234" fill="#fff" font-size="10" text-anchor="middle">e.g. Component: Jira</text>
  <text x="115" y="250" fill="#aaa" font-size="9" text-anchor="middle">Admin requests: 100</text>
  <text x="115" y="264" fill="#aaa" font-size="9" text-anchor="middle">Self-service req: 100</text>
  <!-- Arrow: sample pool → classifier -->
  <line x1="200" y1="238" x2="428" y2="130" stroke="#333" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arr-dim)"/>

  <!-- ── ADMIN PATH ── -->
  <!-- Arrow: Classify → Admin ticket -->
  <line x1="615" y1="90" x2="720" y2="52" stroke="#ff6b6b" stroke-width="1.5" marker-end="url(#arr-r)"/>
  <rect x="632" y="56" width="36" height="14" rx="3" fill="#080C0F"/>
  <text x="650" y="67" fill="#ff6b6b" font-size="8" text-anchor="middle">admin</text>

  <rect x="722" y="32" width="148" height="68" rx="8" fill="#0d1117" stroke="#ff6b6b" stroke-width="1.5"/>
  <text x="796" y="52" fill="#ff6b6b" font-size="8" text-anchor="middle" letter-spacing="2">ADMIN PATH</text>
  <text x="796" y="68" fill="#fff" font-size="11" text-anchor="middle" font-weight="700">Create Support</text>
  <text x="796" y="84" fill="#fff" font-size="11" text-anchor="middle" font-weight="700">Ticket</text>

  <!-- Arrow: Ticket → Support Team -->
  <line x1="796" y1="100" x2="796" y2="176" stroke="#ff6b6b" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-r)"/>

  <rect x="722" y="178" width="148" height="44" rx="8" fill="#1a0a0a" stroke="#ff6b6b" stroke-width="1"/>
  <text x="796" y="196" fill="#ff6b6b" font-size="8" text-anchor="middle" letter-spacing="2">RESOLUTION</text>
  <text x="796" y="212" fill="#fff" font-size="11" text-anchor="middle" font-weight="700">Support Team</text>

  <!-- ── SELF-SERVICE PATH ── -->
  <!-- Arrow: Classify → Self-service -->
  <line x1="522" y1="158" x2="522" y2="206" stroke="#00E5A0" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="530" y="186" fill="#00E5A0" font-size="8">self-service</text>

  <!-- ── FIND SIMILAR JIRAS VIA MCP ── -->
  <rect x="390" y="208" width="264" height="96" rx="8" fill="#0d1117" stroke="#B388FF" stroke-width="2"/>
  <text x="522" y="226" fill="#B388FF" font-size="8" text-anchor="middle" letter-spacing="2">STEP 3 · MCP TOOL</text>
  <text x="522" y="242" fill="#fff" font-size="12" text-anchor="middle" font-weight="700">Find Similar Jiras</text>
  <text x="522" y="258" fill="#aaa" font-size="8.5" text-anchor="middle">10–20 iterations · different JQL queries</text>
  <text x="522" y="272" fill="#aaa" font-size="8.5" text-anchor="middle">semantic search · only RESOLVED tickets</text>
  <text x="522" y="286" fill="#aaa" font-size="8.5" text-anchor="middle">LLM re-ranks → top 3–4 matches</text>

  <!-- Annotation right -->
  <text x="664" y="230" fill="#555" font-size="8">different JQLs</text>
  <text x="664" y="242" fill="#555" font-size="8">per iteration</text>
  <text x="664" y="254" fill="#555" font-size="8">to maximise</text>
  <text x="664" y="266" fill="#555" font-size="8">recall</text>

  <!-- Feedback loop: low confidence back to classify -->
  <path d="M390,256 C350,256 350,112 430,112" stroke="#555" stroke-width="1.2" stroke-dasharray="4,3" fill="none" marker-end="url(#arr-dim)"/>
  <text x="328" y="195" fill="#555" font-size="8" text-anchor="middle">conf &lt; 75</text>
  <text x="328" y="207" fill="#555" font-size="8" text-anchor="middle">re-classify</text>

  <!-- Arrow: Similar Jiras → Extract Comments -->
  <line x1="522" y1="304" x2="522" y2="352" stroke="#B388FF" stroke-width="1.5" marker-end="url(#arr-p)"/>
  <text x="530" y="332" fill="#B388FF" font-size="8">comments</text>

  <!-- ── EXTRACT SOLUTION ── -->
  <rect x="390" y="354" width="264" height="76" rx="8" fill="#0d1117" stroke="#00E5A0" stroke-width="2"/>
  <text x="522" y="372" fill="#00E5A0" font-size="8" text-anchor="middle" letter-spacing="2">STEP 4 · LLM SYNTHESIS</text>
  <text x="522" y="388" fill="#fff" font-size="12" text-anchor="middle" font-weight="700">Extract Solution</text>
  <text x="522" y="404" fill="#aaa" font-size="8.5" text-anchor="middle">read comments from top Jiras</text>
  <text x="522" y="418" fill="#aaa" font-size="8.5" text-anchor="middle">wiki page links · redirects · how-to steps</text>

  <!-- Arrow: Extract → Final Answer -->
  <line x1="522" y1="430" x2="522" y2="478" stroke="#00E5A0" stroke-width="1.5" marker-end="url(#arr-g)"/>

  <!-- ── FINAL ANSWER ── -->
  <rect x="390" y="480" width="264" height="64" rx="8" fill="#0a1a12" stroke="#00E5A0" stroke-width="2.5"/>
  <text x="522" y="498" fill="#00E5A0" font-size="8" text-anchor="middle" letter-spacing="2">OUTPUT</text>
  <text x="522" y="514" fill="#fff" font-size="13" text-anchor="middle" font-weight="700">Final Answer</text>
  <text x="522" y="530" fill="#aaa" font-size="8.5" text-anchor="middle">delivered to user · no ticket needed</text>

  <!-- Arrow: Final Answer → Fallback Support Team (straight horizontal, right side) -->
  <line x1="654" y1="512" x2="720" y2="512" stroke="#ff6b6b" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arr-r)"/>
  <rect x="660" y="499" width="54" height="13" rx="3" fill="#080C0F"/>
  <text x="687" y="509" fill="#ff6b6b" font-size="7.5" text-anchor="middle">low conf</text>

  <rect x="722" y="490" width="148" height="44" rx="8" fill="#1a0a0a" stroke="#ff6b6b" stroke-width="1"/>
  <text x="796" y="508" fill="#ff6b6b" font-size="8" text-anchor="middle" letter-spacing="2">FALLBACK</text>
  <text x="796" y="524" fill="#fff" font-size="11" text-anchor="middle" font-weight="700">Support Team</text>

  <!-- Left side metrics -->
  <text x="30" y="320" fill="#555" font-size="8" letter-spacing="2">— IMPACT —</text>

  <rect x="30" y="332" width="170" height="54" rx="6" fill="#0a1a12" stroke="#00E5A0" stroke-width="1.5"/>
  <text x="115" y="351" fill="#00E5A0" font-size="20" text-anchor="middle" font-weight="700">30–40%</text>
  <text x="115" y="368" fill="#aaa" font-size="8.5" text-anchor="middle">support requests automated</text>

  <rect x="30" y="398" width="170" height="54" rx="6" fill="#0a1a12" stroke="#00E5A0" stroke-width="1.5"/>
  <text x="115" y="417" fill="#00E5A0" font-size="20" text-anchor="middle" font-weight="700">700+ hrs</text>
  <text x="115" y="434" fill="#aaa" font-size="8.5" text-anchor="middle">engineering hours saved/year</text>

  <!-- Footer -->
  <text x="450" y="600" fill="#333" font-size="8" text-anchor="middle">HuggingFace Embeddings · RAG Classification · MCP Jira Tool · LLM Synthesis · Threshold 75</text>
</svg>
